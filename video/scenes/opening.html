<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MODA デモ動画 冒頭（0:00〜0:52）</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib/common.js"></script>
<script src="opening.lines.js"></script>
<script src="opening.voice.js"></script>
<script src="lib/without.js"></script>
<script src="lib/with.js"></script>
<script>
/*
 * デモ動画の冒頭（11/8 夕方4）。このあとに実際の画面の録画（実演）が続く。
 *   場面1 つかみ（声は何のアプリかを1文で。画面には3行の説明も出す）
 *   場面2 来店（短く）
 *   場面3 販売の前に、薬剤師が確かめること（5項目 → 区分の図を右から差し込む → 日本語が話せない患者さんでも同じ。sales-procedures.md P01〜P07）
 *   場面4 MODA がないとき（翻訳アプリ。①〜⑤のうち、もれた手順に「？」）
 *   最後は円が閉じて「MODA があると」。MODA の説明は、このあとの実際の画面（実演）の中でする（11/8 夜 依頼主の判断）
 * ナレーションは場面ごとにひと続き。場面の長さはその長さから、動きのタイミングは文の途中の言葉の位置（[名前] の印）から決める（opening.voice.js）。文は opening.lines.js。
 * ナレーションは window.NARRATION の文を render.mjs が読み上げ音声にして重ねる。
 * 読み上げ用の文なので、MODA は「モダ」、濫用は「乱用」と書いている（読み間違いを防ぐため）。
 */
// ---- 予定表：ナレーションの文の長さ（opening.voice.js）から、場面の長さと動きのタイミングを決める ----
const LINES = window.OPENING_LINES;
const plain = (k) => LINES[k].replace(/[{}|^~]|\[[a-z0-9_]+\]/g, "");
const DUR = (k) => window.VOICE_DUR?.[k] ?? [...plain(k)].length / 6.2; // 測っていなければ目安
const L = {}; // 場面ごとのナレーションの読み始め（動画全体の時刻）と長さ
const say = (k, at) => { L[k] = { t: at, d: DUR(k) }; return at + DUR(k); };
// [名前] の言葉が読まれる時刻（動画全体）。測っていなければ、文の中の位置から目安を出す
function mark(k, name) {
  const m = window.VOICE_MARK?.[k]?.[name];
  if (m != null) return L[k].t + m;
  const before = LINES[k].slice(0, LINES[k].indexOf(`[${name}]`)).replace(/[{}|^~]|\[[a-z0-9_]+\]/g, "");
  return L[k].t + L[k].d * ([...before].length / [...plain(k)].length);
}
const SEG = { title: 0 };
let e = say("T", 0.6);
SEG.arrival = e + 1.3; // 画面の3行を読めるよう、少し長めに
e = say("A", SEG.arrival + 0.3);
SEG.proc = Math.max(e + 0.2, SEG.arrival + 4.2);
e = say("P", SEG.proc + 0.3);
SEG.without = e + 1.2;
e = say("W", SEG.without + 1.0);
// 「ないとき」の最後は円が閉じて「MODA があると」→ 実際の画面（実演）へ。説明は実演の中でする（11/8 夜 依頼主の判断）
SEG.flow = e + 1.6; // 円が閉じて「MODA があると」を読めるだけ見せる
const DURATION = Number(SEG.flow.toFixed(2));
window.DURATION = DURATION;
const rel = (k, seg) => L[k].t - SEG[seg];
const relm = (k, name, seg) => mark(k, name) - SEG[seg];
const segLen = (seg, next) => (next ? SEG[next] : DURATION) - SEG[seg];

// 「ないとき」：やりとり → 答えがもれる（W2 の読み始め）→ 日本語だけの説明書（W3 の読み始め）→ 円が閉じる
const LEN_WITHOUT = segLen("without", "flow");
const WARP_WITHOUT = makeWarp([[0, 0], [relm("W", "miss", "without") - 0.2, 6.5], [relm("W", "leaf", "without") - 0.2, 8.35], [LEN_WITHOUT - 1.7, 11.0], [LEN_WITHOUT - 1.2, 11.7], [LEN_WITHOUT, 11.7]]);
// 「あるとき」：ナレーション1文のあいだに、答える → 候補 → 承認 → 説明書が患者さんへ

// 字幕はナレーションの文と同じ時に出す
// 字幕は、ナレーションのその言葉のところで切り替える
const CAPS_WITHOUT = [
  [rel("W", "without") - 0.2, relm("W", "slow", "without") - 0.3, "いまの現場では、翻訳アプリで対応することが多い。"],
  [relm("W", "slow", "without") - 0.2, relm("W", "miss", "without") - 0.25, "翻訳アプリでのやりとりは、時間がかかる。"],
  [relm("W", "miss", "without") - 0.2, relm("W", "leaf", "without") - 0.25, "まとめて聞くと、答えがもれるおそれ。"],
  [relm("W", "leaf", "without") - 0.2, LEN_WITHOUT - 0.9, "説明書も、日本語のまま。"],
];
const CAPS_ARRIVAL = [[0.3, segLen("arrival", "proc") - 0.1, "日本語が話せない患者さんも、市販薬を買いに来ます。"]];

// ---- 場面1：タイトル ----
const GREETINGS = ["Xin chào", "Hello", "你好", "안녕하세요", "Hola", "Olá", "Bonjour", "您好", "こんにちは"];
const TITLE_LINES = [
  [rel("T", "title") + L.T.d * 0.3, "言語の壁をなくす接客支援。", C.ink, 660],
  [rel("T", "title") + L.T.d * 0.55, "AI は助言せず、訳して聞き取るだけ。", C.teal, 745],
  [rel("T", "title") + L.T.d * 0.8, "薬の判断は薬剤師。", C.ink, 830],
];
function drawTitle(t) {
  room(false);
  // ゆっくり漂う、9言語のあいさつ
  GREETINGS.forEach((g, i) => {
    const x = ((i * 233 + GT * (18 + i * 3)) % (W + 400)) - 200;
    const y = 120 + ((i * 137) % 840);
    alpha(0.22, () => {
      ctx.font = `700 34px ${FONT}`;
      const w = ctx.measureText(g).width + 48;
      ctx.strokeStyle = C.tealLight; ctx.lineWidth = 2; rr(x - w / 2, y - 30, w, 60, 30); ctx.stroke();
      text(g, x, y, 34, C.tealLight, 700);
    });
  });
  const s = pop(t, 0.3, 0.6);
  alpha(clamp(prog(t, 0.3, 0.4)), () => {
    ctx.save(); ctx.translate(W / 2, 330); ctx.scale(s, s);
    text("MODA", 0, 0, 150, C.teal, 800);
    ctx.restore();
  });
  alpha(prog(t, 0.9, 0.5), () => text("Multilingual OTC Dispensing Assistant", W / 2, 430, 30, C.muted, 600));
  // だれのためのツールか（11/7 追加）
  const kw = easeOut(prog(t, 1.4, 0.6));
  alpha(kw, () => {
    ctx.font = `800 44px ${FONT}`;
    const w = ctx.measureText("外国人の患者さんと薬剤師をつなぐ、薬局の接客支援").width + 80;
    ctx.fillStyle = C.tealSoft; rr(W / 2 - w / 2, 478 + (1 - kw) * 16, w, 76, 38); ctx.fill();
    text("外国人の患者さんと薬剤師をつなぐ、薬局の接客支援", W / 2, 516 + (1 - kw) * 16, 44, C.teal, 800);
  });
  TITLE_LINES.forEach(([st, s2, col, y]) => {
    const k = easeOut(prog(t, st, 0.6));
    alpha(k, () => text(s2, W / 2, y + (1 - k) * 24, 52, col, 800));
  });
  alpha(prog(t, rel("T", "title") + L.T.d + 0.2, 0.6), () => text("登場する人・薬はすべて架空です", W / 2, 935, 26, C.muted, 700));
}

// ---- 場面2：背景（外国人の患者さんが来店） ----
function drawArrival(t) {
  room(false);
  const walk = easeInOut(prog(t, 0.0, 1.1));
  const px = lerp(-220, PX, walk);
  const step = walk < 1 ? Math.abs(Math.sin(t * 9)) * -10 : 0; // 歩くときの上下
  const puzzled = t > 3.0;
  person(px, PY + step, {
    ...PATIENT, armL: [0.15, 0.1],
    armR: t > 1.2 && t < 2.6 ? [2.5 + Math.sin(t * 10) * 0.2, 0.4] : [0.2, 0.15], // 手を振ってあいさつ
    mood: t > 1.1 ? "happy" : "neutral", talk: t > 1.5 && t < 2.9, look: 10,
  });
  person(RX, RY, {
    ...PHARMACIST, armL: [0.2, 0.15], armR: [0.2, 0.15],
    mood: puzzled ? "neutral" : "happy", talk: t > 0.5 && t < 1.2, look: -10,
    nod: t > 0.5 && t < 1.2 ? Math.sin(prog(t, 0.5, 0.7) * Math.PI) * 10 : 0,
    tilt: puzzled ? -0.08 : 0,
  });
  counter();
  bubble(RX - 140, 200, 330, 96, pop(t, 0.5) * (1 - prog(t, 2.6, 0.3)), "いらっしゃいませ", null, false);
  bubble(PX + 200, 200, 520, 120, pop(t, 1.4), "Xin chào. Tôi muốn mua thuốc.", "（こんにちは。薬を買いたいのですが）");
  const q = pop(t, 3.1);
  if (q > 0) {
    ctx.save(); ctx.translate(RX - 150, 300); ctx.rotate(Math.sin(GT * 4) * 0.1); ctx.scale(q, q);
    text("？", 0, 0, 110, C.warn, 900); ctx.restore();
  }
}

// ---- 場面3：販売の前に、薬剤師が確かめること（来店の2人とカウンターはそのまま） ----
const PROC_ITEMS = [
  { full: "体の状態を聞く（問診）", short: "問診" },
  { full: "飲んではいけない薬でないか確かめる（禁忌の確認）", short: "禁忌の確認" },
  { full: "区分ごとの手順を守る", short: "区分ごとの手順", note: "第1類・要指導：書面での説明と記録" },
  { full: "説明して、わかったかを確かめる", short: "説明・理解の確認" },
  { full: "販売の記録を残す", short: "販売の記録" },
];
const PROC_NUMS = ["①", "②", "③", "④", "⑤"];
const PROC_TIERS = [
  { label: "第3類・第2類", blocks: [["①問診", true], ["②禁忌の確認", true]] },
  { label: "指定第2類", blocks: [["①②", false], ["＋相談を促す表示", true]] },
  { label: "第1類・要指導", blocks: [["①②", false], ["③書面・理解の確認・記録", true]] },
  { label: "特定要指導", blocks: [["①②③", false], ["＋別紙書類・服用の確認", true]] },
];
// 5項目は P1 を読んでいるあいだに順に出し、P2（区分によって）の読み始めにパネルが左に寄って区分の図が入る
const PROC_SPLIT = relm("P", "tiers", "proc") - 0.2;
const PROC_SAME = relm("P", "same", "proc") - 0.1; // 「これは、日本語が話せない患者さんであっても、同じです」
const procItemT = (i) => rel("P", "proc") + 0.4 + i * Math.max(0.45, (PROC_SPLIT - rel("P", "proc") - 1.0) / 4);
const CAPS_PROC = [
  [rel("P", "proc") - 0.2, PROC_SPLIT, "販売の前に、薬剤師が確かめること"],
  [PROC_SPLIT + 0.2, PROC_SAME - 0.2, "市販薬は「区分」によって、手順が変わります"],
  [PROC_SAME, segLen("proc", "without") - 0.2, "日本語が話せない患者さんでも、同じ手順が必要です"],
];
function drawProcedure(t) {
  room(false);
  const ks = easeOut(prog(t, PROC_SAME, 0.7));
  if (ks > 0) {
    alpha(ks * 0.9, () => {
      const g = ctx.createRadialGradient(PX, PY - 120, 20, PX, PY - 120, 300);
      g.addColorStop(0, "rgba(16,163,127,.28)"); g.addColorStop(1, "rgba(16,163,127,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(PX, PY - 120, 300, 0, Math.PI * 2); ctx.fill();
    });
  }
  person(PX, PY, { ...PATIENT, armL: [0.15, 0.1], armR: [0.2, 0.15], mood: "neutral", look: 12 });
  person(RX, RY, {
    ...PHARMACIST, armL: t > 0.4 && t < PROC_SPLIT ? [1.1, -0.4] : [0.2, 0.15], armR: [0.2, 0.15],
    mood: t > 0.6 ? "happy" : "neutral", look: -12, talk: t > rel("P", "proc") && t < rel("P", "proc") + L.P.d,
    nod: t > 0.4 && t < 1.1 ? Math.sin(prog(t, 0.4, 0.7) * Math.PI) * 10 : 0,
  });
  counter();
  const k1 = easeOut(prog(t, 0.2, 0.6));
  const p2 = easeInOut(prog(t, PROC_SPLIT, 0.9));
  // 5項目のパネル（中央 → 左に縮む）
  const x0 = lerp(470, 430, p2), w = lerp(980, 440, p2), y0 = 150, h = 610;
  alpha(k1, () => {
    const yy = y0 + (1 - k1) * 30;
    shadowed(() => { ctx.fillStyle = "#fff"; rr(x0, yy, w, h, 28); ctx.fill(); });
    ctx.fillStyle = C.teal; rr(x0, yy, w, 12, 6); ctx.fill();
    alpha(1 - p2, () => text("販売の前に、薬剤師が確かめること", x0 + w / 2, y0 + 62, 40, C.ink, 800));
    alpha(p2, () => text("薬剤師が確かめること", x0 + w / 2, y0 + 58, 30, C.ink, 800));
    PROC_ITEMS.forEach((it, i) => {
      const s = pop(t, procItemT(i), 0.4);
      if (s <= 0) return;
      const y = lerp(y0 + 140 + i * 92, y0 + 130 + i * 92, p2);
      const cx = x0 + 60;
      const hi = i === 2 && p2 > 0;
      if (hi) alpha(p2, () => { ctx.fillStyle = C.tealSoft; rr(x0 + 18, y - 38, w - 36, 76, 18); ctx.fill(); });
      ctx.save(); ctx.translate(cx, y); ctx.scale(s, s);
      ctx.fillStyle = hi ? C.teal : C.tealSoft; ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
      text(PROC_NUMS[i], 0, 1, 30, hi ? "#fff" : C.teal, 800);
      ctx.restore();
      alpha(s * (1 - p2), () => {
        text(it.full, cx + 48, it.note ? y - 12 : y, 32, C.ink, 700, "left");
        if (it.note) text(it.note, cx + 48, y + 22, 22, C.muted, 700, "left");
      });
      alpha(s * p2, () => text(it.short, cx + 48, y, 28, hi ? C.teal : C.ink, 800, "left"));
    });
  });
  // 区分の図（右から差し込む）
  const kd = easeOut(prog(t, PROC_SPLIT + 0.3, 0.8));
  if (kd > 0) {
    const dx = lerp(W + 40, 900, kd), dw = 600, dy = 150, dh = 610;
    shadowed(() => { ctx.fillStyle = "#fff"; rr(dx, dy, dw, dh, 28); ctx.fill(); });
    ctx.fillStyle = C.teal; rr(dx, dy, dw, 12, 6); ctx.fill();
    text("③ 区分によって手順が変わる", dx + dw / 2, dy + 58, 30, C.ink, 800);
    PROC_TIERS.forEach((tr, i) => {
      const kt = easeOut(prog(t, PROC_SPLIT + 1.0 + i * 0.55, 0.5));
      if (kt <= 0) return;
      const y = dy + 470 - i * 92;
      alpha(kt, () => {
        text(tr.label, dx + 178, y, 22, C.ink, 800, "right");
        let bx = dx + 192 + (1 - kt) * 60;
        tr.blocks.forEach(([s, isNew]) => {
          ctx.font = `800 19px ${FONT}`;
          const bw = ctx.measureText(s).width + 26;
          ctx.fillStyle = isNew ? C.teal : "#a9bcc6"; rr(bx, y - 26, bw, 52, 12); ctx.fill();
          text(s, bx + bw / 2, y, 19, "#fff", 800);
          bx += bw + 8;
        });
      });
    });
    const kv = easeOut(prog(t, PROC_SPLIT + 3.6, 0.7));
    alpha(kv, () => {
      ctx.save(); ctx.fillStyle = "rgba(109,79,194,.12)"; ctx.strokeStyle = C.violet; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
      rr(dx + 24, dy + 530, dw - 48, 60, 14); ctx.fill(); ctx.stroke(); ctx.restore();
      text("指定濫用防止：区分とは別に、年齢・数量・使用目的も確認", dx + dw / 2, dy + 560, 19, C.violet, 800);
    });
  }
}

// BGM（music.mjs）：場面ごとに曲調を変える
window.MUSIC = [
  { t: 0, len: SEG.arrival, part: "intro" },
  { t: SEG.arrival, len: SEG.proc - SEG.arrival, part: "arrival" },
  { t: SEG.proc, len: SEG.without - SEG.proc, part: "steps" },
  { t: SEG.without, len: SEG.flow - SEG.without, part: "problem" },
];

window.SOUND_EVENTS = [
  { t: 0.3, kind: "stamp" }, { t: 1.4, kind: "pop" },
  ...TITLE_LINES.map(([st]) => ({ t: st, kind: "pop" })),
  { t: SEG.arrival + 0.5, kind: "pop" }, { t: SEG.arrival + 1.4, kind: "pop" }, { t: SEG.arrival + 3.1, kind: "huh" },
  ...PROC_ITEMS.map((_, i) => ({ t: SEG.proc + procItemT(i), kind: "pop" })),
  { t: SEG.proc + PROC_SPLIT + 0.3, kind: "swoosh" },
  { t: SEG.proc + PROC_SAME, kind: "pop" },
  ...PROC_TIERS.map((_, i) => ({ t: SEG.proc + PROC_SPLIT + 1.0 + i * 0.55, kind: "check" })),
  ...WITHOUT_EVENTS.map((e) => ({ ...e, t: SEG.without + WARP_WITHOUT.toReal(e.t) })),
];

// ナレーション（t＝読み始める時刻、max＝読み終えるまでの上限秒。長いときは render.mjs が速さを上げて収める）
// {…} で囲んだ言葉は、少しゆっくり・少し高め・少し大きく読む（強調）
// 文ごとの読み始めは予定表（L）のとおり。長さは測ってあるので、速さは変えない（max は少し余裕をとる）
window.NARRATION = Object.entries(L).map(([k, v]) => ({ t: v.t, max: v.d + 0.5, text: LINES[k] }));

function captions(list, t, color) {
  for (const [s, e, msg, col] of list) caption(msg, fadeWindow(t, s, e), col || color);
}

window.draw = function (tg) {
  GT = tg;
  ctx.clearRect(0, 0, W, H);
  if (tg < SEG.arrival) {
    drawTitle(tg - SEG.title);
  } else if (tg < SEG.proc) {
    drawArrival(tg - SEG.arrival);
    captions(CAPS_ARRIVAL, tg - SEG.arrival, C.ink);
  } else if (tg < SEG.without) {
    drawProcedure(tg - SEG.proc);
    captions(CAPS_PROC, tg - SEG.proc, C.ink);
  } else {
    const lt = tg - SEG.without;
    drawWithout(WARP_WITHOUT.toScene(lt));
    captions(CAPS_WITHOUT, lt, C.ink);
    irisClose(WARP_WITHOUT.toScene(lt));
  }
  // 場面の切れ目は白くしてつなぐ（ないとき→あるときは円の切り替え）。最初と最後も白から・白へ
  const dark = Math.max(
    1 - prog(tg, 0, 0.4),
    clamp(1 - Math.abs(tg - SEG.arrival) / 0.4),
    clamp(1 - Math.abs(tg - SEG.without) / 0.4),
  );
  if (dark > 0) { ctx.fillStyle = `rgba(${C.fade},${dark})`; ctx.fillRect(0, 0, W, H); }
};

window.__rendering = false;
document.fonts.ready.then(() => {
  const start = performance.now();
  (function loop() {
    if (window.__rendering) return;
    window.draw(((performance.now() - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  })();
});
</script>
</body>
</html>
